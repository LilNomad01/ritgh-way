<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#071b43" />
    <title>Right Way — Sem conexão</title>
    <style>
      *{box-sizing:border-box}body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;color:#10203c;background:#f6f8fc;font-family:Arial,sans-serif}.card{width:min(430px,100%);padding:36px 28px;border:1px solid #e4eaf3;border-radius:24px;background:#fff;box-shadow:0 20px 60px rgba(7,27,67,.1);text-align:center}.mark{width:70px;height:70px;display:grid;place-items:center;margin:0 auto 20px;border-radius:20px;color:#fff;background:#071b43;font-size:32px}h1{margin:0 0 10px;font-size:27px}p{margin:0 0 24px;color:#70809d;line-height:1.55}button{min-height:46px;padding:0 22px;border:0;border-radius:12px;color:#fff;background:#d5162d;font-weight:800}
    </style>
  </head>
  <body><main class="card"><div class="mark">RW</div><h1>Você está sem conexão</h1><p>Reconecte-se para acessar as aulas, vídeos e sincronizar seu progresso.</p><button onclick="location.reload()">Tentar novamente</button></main></body>
</html>
